<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one narrow reading column, lecture header strip on top, sticky language bar, one question card at a time */
:root{
  --bg:#FFFFFF; --surface:#F1F5F9; --line:#E2E8F0;
  --ink:#0E1116; --body:#2F3844; --sub:#6E7887;
  --blue:#1D52FC; --blue-deep:#1136C7; --blue-soft:#E8EDFE; --blue-line:#D5DEFC; --on-blue:#FFFFFF;
  --gold:#D9A445; --gold-deep:#B8862E; --cream:#FDF6E7; --cream-line:#F0DFB8;
  --rose:#FDECEF; --rose-line:#F6D6DD; --rose-ink:#8E3450;
  --bar-a:#E9AE48; --bar-b:#3E5E86; --strip-ink:#0E1116;
  --glow:rgba(29,82,252,.22);
  --shadow:0 6px 22px rgba(20,40,90,.07);
  --f-disp:"Black Han Sans","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#161C2E; --line:#273049;
    --ink:#EEF1F8; --body:#CBD2E0; --sub:#8F99AE;
    --blue:#5B82FF; --blue-deep:#3E66F2; --blue-soft:#1A2452; --blue-line:#2D3C7A; --on-blue:#FFFFFF;
    --gold:#E0B055; --gold-deep:#E8BF6A; --cream:#231D12; --cream-line:#4A3C1E;
    --rose:#2B1820; --rose-line:#5A2A3C; --rose-ink:#F2A9BE;
    --glow:rgba(91,130,255,.20); --shadow:0 6px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161C2E; --line:#273049;
  --ink:#EEF1F8; --body:#CBD2E0; --sub:#8F99AE;
  --blue:#5B82FF; --blue-deep:#3E66F2; --blue-soft:#1A2452; --blue-line:#2D3C7A; --on-blue:#FFFFFF;
  --gold:#E0B055; --gold-deep:#E8BF6A; --cream:#231D12; --cream-line:#4A3C1E;
  --rose:#2B1820; --rose-line:#5A2A3C; --rose-ink:#F2A9BE;
  --glow:rgba(91,130,255,.20); --shadow:0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* lecture header strip */
.strip{display:flex;align-items:center;height:28px;background:linear-gradient(90deg,var(--bar-a),var(--bar-b));color:var(--strip-ink);font-weight:700;font-size:13px}
.strip .no{background:#0E1116;color:#fff;height:100%;display:grid;place-items:center;padding-inline:max(12px,env(safe-area-inset-left,0px)) 12px;font-variant-numeric:tabular-nums}
.strip .lab{padding-inline:12px;white-space:nowrap}
.strip .right{margin-left:auto;padding-right:max(16px,env(safe-area-inset-right,0px));color:#fff;font-weight:500;font-size:12px;white-space:nowrap}
@media (max-width:520px){.strip .right{display:none}}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:28px 0}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(90deg,transparent 52%,var(--glow) 72%,transparent 80%,var(--glow) 93%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.gold{background:var(--gold);color:#1B1406}
.chip.soft{background:var(--blue-soft);color:var(--blue-deep)}
.chip.cream{background:var(--cream);color:var(--gold-deep);border:1px solid var(--cream-line)}
:root[data-theme="dark"] .chip.soft{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.soft{color:var(--ink)}}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(2.3rem,7vw,3.3rem);line-height:1.15;color:var(--ink);margin:12px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
.rule{height:3px;margin-top:14px;background:linear-gradient(90deg,var(--gold),#6C7A8E)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:12px 0 0;color:var(--sub);font-size:14px}
.meta b{color:var(--blue);font-weight:700}
.hero .sub-tr{display:block;color:var(--sub);font-size:13px;margin-top:2px}

/* sticky language bar */
.langbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:20px}
.langbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.langbar .lb{font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.langs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px}
.langs::-webkit-scrollbar{display:none}
.lang{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--body);min-height:36px}
.lang[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

/* progress */
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:20px 0 14px}
.seg{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.seg:disabled{cursor:default;opacity:.55}
.seg.ok{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.seg.no{background:var(--rose);border-color:var(--rose-line);color:var(--rose-ink)}
.seg.cur{outline:2px solid var(--ink);outline-offset:1px}

/* question card */
.card{background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px 20px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.count{margin-left:auto;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(1.12rem,3.6vw,1.3rem);font-weight:700;color:var(--ink);line-height:1.55;margin:16px 0 18px;text-wrap:pretty}
.ko{display:block}
.tr{display:block;font-size:.8em;font-weight:500;color:var(--sub);line-height:1.5;margin-top:3px}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue-line);background:var(--blue-soft)}
.opt .bd{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--blue-line);color:var(--blue);font-weight:700;font-size:13px;margin-top:1px}
.opt .tx{min-width:0;font-size:15.5px;color:var(--body);font-weight:500}

.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 8px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.ox:hover:not(:disabled){border-color:var(--blue-line);background:var(--blue-soft)}
.ox .gl{font-family:var(--f-disp);font-size:3rem;line-height:1;color:var(--blue)}
.ox.x .gl{color:var(--rose-ink)}
.ox .lab{font-size:14.5px;font-weight:600;color:var(--body);text-align:center}

.opt:disabled,.ox:disabled{cursor:default}
.is-right{background:var(--blue-soft)!important;border-color:var(--blue)!important}
.is-right .bd{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.is-wrong{background:var(--rose)!important;border-color:var(--rose-ink)!important}
.is-wrong .bd{background:var(--rose-ink);border-color:var(--rose-ink);color:var(--bg)}
.is-dim{opacity:.5}

/* feedback */
.fb{margin-top:18px;display:grid;gap:10px}
.verdict{display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:16.5px;margin:0;color:var(--ink)}
.verdict .mk{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
.fb.ok .mk{background:var(--blue)}
.fb.no .mk{background:var(--rose-ink);color:var(--bg)}
.ans{font-size:14.5px;color:var(--body);margin:0}
.ans b{color:var(--blue-deep)}
:root[data-theme="dark"] .ans b{color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ans b{color:var(--blue)}}
.exp{background:var(--cream);border:1px solid var(--cream-line);border-radius:14px;padding:14px 16px}
.exp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.exp-h .src{margin-left:auto;font-size:12.5px;color:var(--gold-deep);font-weight:600}
.exp p{margin:0;font-size:15px;color:var(--body)}

.nav{display:flex;gap:10px;margin-top:18px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15.5px;cursor:pointer;min-height:48px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.btn .tr{color:inherit;opacity:.8;margin-top:1px}
.btn.primary{background:var(--blue);color:var(--on-blue);margin-left:auto;min-width:160px}
.btn.primary:hover{background:var(--blue-deep)}
.btn.ghost{background:transparent;color:var(--sub);border:1.5px solid var(--line)}
.hint{color:var(--sub);font-size:13.5px;margin:14px 0 0;text-align:center}

/* result */
.result{text-align:left}
.score{display:flex;align-items:baseline;gap:8px;margin:14px 0 4px}
.score b{font-family:var(--f-disp);font-weight:400;font-size:4.5rem;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-disp);font-size:1.8rem;color:var(--sub)}
.r-line{font-size:17px;font-weight:700;color:var(--ink);margin:6px 0 0}
.r-msg{margin:6px 0 0;font-size:15.5px}
.review{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.review h3{font-size:15px;color:var(--ink);margin:0 0 10px}
.rv{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.rv li{display:flex;gap:12px;align-items:flex-start;background:var(--rose);border:1px solid var(--rose-line);border-radius:12px;padding:12px 14px}
.rv .n{font-weight:700;color:var(--rose-ink);flex:none;font-variant-numeric:tabular-nums}
.rv .c{min-width:0;flex:1;font-size:14.5px}
.rv .c .ans{margin-top:4px;font-size:13.5px}
.rv button{flex:none;border:1px solid var(--rose-line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--rose-ink)}
.allok{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:14px 16px;margin-top:20px;color:var(--ink);font-weight:600}

footer{margin:28px 0 36px;color:var(--sub);font-size:12.5px;line-height:1.6}
footer b{color:var(--body);font-weight:700}

@media (max-width:440px){
  .card{padding:18px 15px 16px;border-radius:16px}
  .seg{height:26px;font-size:11px;border-radius:6px}
  .prog{gap:4px}
  .btn.primary{min-width:0;flex:1}
  .rv li{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>

  exp:{ko:"같은 글을 두 군데 이상 제출하거나 서론·결론만 바꾸어 내는 것은 ‘자기복제·중복 제출형’ 부정행위입니다. 내가 쓴 글도 다시 활용할 때는 그 사실을 밝혀야 합니다.",zh:"同一篇文章提交到两个以上的地方，或只改动引言和结论再提交，属于“自我复制·重复提交型”不端行为。即使是自己写的文章，再次使用时也必须说明。",en:"Submitting the same text in two or more places, or changing only the introduction and conclusion, is the 'self-duplication / duplicate submission' type of misconduct. Even when you reuse your own writing, you must say so.",ru:"Сдавать один и тот же текст в два и более места или менять только введение и заключение — это нарушение типа «самоплагиат / повторная сдача». Даже если вы повторно используете свой текст, об этом нужно сообщить.",ja:"同じ文章を二か所以上に提出したり、序論・結論だけを変えて提出したりするのは「自己複製・重複提出型」の不正行為です。自分の文章でも、再利用するときはそのことを明記しなければなりません。",mn:"Нэг бичвэрийг хоёр ба түүнээс дээш газар өгөх, эсвэл зөвхөн удиртгал, дүгнэлтийг нь өөрчилж өгөх нь «өөрийгөө хуулах·давхар өгөх» төрлийн зөрчил юм. Өөрийн бичвэрийг дахин ашиглахдаа ч үүнийгээ заавал тэмдэглэх ёстой."}},

 {type:"ox",ans:1,src:"교재 83쪽",
  q:{ko:"출처만 정확히 쓰면, 내 생각 없이 인용 자료만으로 글을 채워도 된다.",zh:"只要准确注明出处，即使没有自己的想法、只用引用资料填满文章也可以。",en:"As long as I cite the sources correctly, I can fill my essay with quotations only, without my own ideas.",ru:"Если правильно указать источники, можно заполнить текст одними цитатами без собственных мыслей.",ja:"出典さえ正確に書けば、自分の考えなしに引用資料だけで文章を埋めてもよい。",mn:"Эх сурвалжаа зөв бичсэн л бол өөрийн санаагүйгээр зөвхөн иш татсан материалаар бичвэрээ дүүргэж болно."},

 {type:"ox",ans:0,src:"교재 84–86쪽",

  exp:{ko:"인용문이 길면 따옴표를 쓰지 않고 별도의 인용 단락을 만듭니다. 3번처럼 원문을 마음대로 줄이면 안 됩니다. 인용 부분은 원문과 완전히 일치해야 합니다.",zh:"引文较长时，不用引号，而是另起一个引文段落。不能像3那样随意删减原文，引用部分必须与原文完全一致。",en:"A long quotation goes in a separate block without quotation marks. Never shorten the original as in option 3; the quoted part must match the original exactly.",ru:"Длинную цитату оформляют отдельным абзацем без кавычек. Нельзя сокращать оригинал, как в варианте 3: цитата должна точно совпадать с ним.",ja:"引用文が長いときは引用符を使わず、別の引用段落を作ります。3のように原文を勝手に短くしてはいけません。引用部分は原文と完全に一致しなければなりません。",mn:"Урт эшлэлийг хашилтгүйгээр тусдаа догол мөр болгоно. 3 шиг эх бичвэрийг дураараа богиносгож болохгүй; эшлэл эх бичвэртэй яг тохирох ёстой."}},
 {type:"ox",ans:0,src:"교재 87–89쪽",
  q:{ko:"본문에 넣으면 자연스럽지 않은 보충 설명은 ‘내용 각주’로 처리한다.",zh:"放进正文会显得不自然的补充说明，用“内容脚注”来处理。",en:"Extra explanations that would read awkwardly in the main text go into a 'content footnote'.",ru:"Дополнительные пояснения, которые неуместны в основном тексте, выносят в «содержательную сноску».",ja:"本文に入れると不自然になる補足説明は「内容脚注」で処理する。",mn:"Үндсэн бичвэрт оруулбал зохимжгүй нэмэлт тайлбарыг «агуулгын зүүлт»-ээр бичнэ."},
  exp:{ko:"각주에는 두 종류가 있습니다. ‘참고문헌 각주’는 인용하거나 참조한 원문의 출처를 밝히고, ‘내용 각주’는 본문에 넣기 어려운 보충 설명을 처리합니다.",zh:"脚注分两种。“参考文献脚注”注明所引用或参考原文的出处，“内容脚注”处理难以放进正文的补充说明。",en:"There are two kinds of footnotes. A 'reference footnote' gives the source of what you quoted or consulted; a 'content footnote' holds extra explanation that does not fit the main text.",ru:"Сноски бывают двух видов. «Библиографическая сноска» указывает источник цитаты или использованного текста, а «содержательная сноска» содержит дополнительные пояснения, которые не вписываются в основной текст.",ja:"脚注には二種類あります。「参考文献脚注」は引用・参照した原文の出典を示し、「内容脚注」は本文に入れにくい補足説明を扱います。",mn:"Зүүлт хоёр төрөл байдаг. «Ном зүйн зүүлт» нь иш татсан, ашигласан эх бичвэрийн эх сурвалжийг заадаг бол «агуулгын зүүлт» нь үндсэн бичвэрт багтахгүй нэмэлт тайлбарыг бичдэг."}},
 {type:"mc",ans:3,src:"강의자료 16·20쪽",
  q:{ko:"AI 활용 기록에 들어가야 할 내용이 아닌 것은?",zh:"下列哪一项不是AI使用记录中应包含的内容？",en:"Which of these does NOT belong in your AI-use record?",ru:"Что из этого НЕ нужно включать в запись об использовании ИИ?",ja:"AI活用記録に含めるべき内容でないものはどれですか。",mn:"Аль нь хиймэл оюун ашигласан тэмдэглэлд орох ёсгүй вэ?"},
  opts:[
   {ko:"사용한 도구와 날짜",zh:"使用的工具和日期",en:"The tool you used and the date",ru:"Использованный инструмент и дата",ja:"使ったツールと日付",mn:"Ашигласан хэрэгсэл ба огноо"},
   {ko:"입력한 프롬프트",zh:"输入的提示词",en:"The prompt you entered",ru:"Введённый запрос (промпт)",ja:"入力したプロンプト",mn:"Оруулсан промпт"},
   {ko:"생성 결과와 수용·거절의 이유",zh:"生成结果以及采纳或拒绝的理由",en:"The output, and why you accepted or rejected it",ru:"Полученный результат и причины, почему вы его приняли или отклонили",ja:"生成結果と、採用・不採用の理由",mn:"Гарсан үр дүн, түүнийг хүлээн авсан эсвэл татгалзсан шалтгаан"},
   {ko:"내 이름과 전화번호",zh:"我的姓名和电话号码",en:"My name and phone number",ru:"Моё имя и номер телефона",ja:"自分の名前と電話番号",mn:"Миний нэр, утасны дугаар"}],
  exp:{ko:"AI 활용 기록에는 도구·날짜·프롬프트·생성 결과·수용과 거절의 이유를 남깁니다. 이름·전화번호 같은 개인정보는 AI에 입력하기 전에 지워야 합니다.",zh:"AI使用记录要写下工具、日期、提示词、生成结果以及采纳或拒绝的理由。姓名、电话号码等个人信息在输入AI之前就应删除。",en:"Your AI-use record includes the tool, date, prompt, output, and why you accepted or rejected it. Personal information such as your name or phone number should be removed before you enter text into the AI.",ru:"В записи об использовании ИИ указывают инструмент, дату, запрос, результат и причины принятия или отклонения. Личные данные, например имя и телефон, нужно удалить ещё до ввода текста в ИИ.",ja:"AI活用記録には、ツール・日付・プロンプト・生成結果・採用と不採用の理由を残します。名前や電話番号などの個人情報は、AIに入力する前に消しておきましょう。",mn:"Хиймэл оюун ашигласан тэмдэглэлд хэрэгсэл, огноо, промпт, гарсан үр дүн, хүлээн авсан эсвэл татгалзсан шалтгааныг бичнэ. Нэр, утасны дугаар зэрэг хувийн мэдээллийг хиймэл оюунд оруулахаасаа өмнө устгах ёстой."}},
 {type:"ox",ans:1,src:"강의자료 16쪽",
  q:{ko:"AI가 고쳐 준 문장을 그대로 제출했다면, 그 문장의 사실 오류는 AI의 책임이다.",zh:"如果原样提交了AI修改过的句子，那么句子中的事实错误由AI负责。",en:"If I submit sentences exactly as the AI revised them, any factual errors in them are the AI's responsibility.",ru:"Если я сдаю предложения в том виде, в каком их исправил ИИ, за фактические ошибки в них отвечает ИИ.",ja:"AIが直した文をそのまま提出したなら、その文の事実の誤りはAIの責任である。",mn:"Хиймэл оюуны зассан өгүүлбэрийг шууд өгсөн бол түүн дэх баримтын алдааг хиймэл оюун хариуцна."},
  exp:{ko:"AI의 사실 오류, 부적절한 표현, 편향은 학생이 직접 검토해야 합니다. AI 사용을 표시했더라도 최종 작성과 제출의 책임은 학생에게 있습니다.",zh:"AI的事实错误、不恰当的表达和偏见，都必须由学生亲自检查。即使标明了使用AI，最终写作和提交的责任仍在学生。",en:"You must check the AI's factual errors, inappropriate wording, and bias yourself. Even if you mark that you used AI, responsibility for the final writing and submission is yours.",ru:"Фактические ошибки, неуместные выражения и предвзятость ИИ студент должен проверять сам. Даже если вы указали, что использовали ИИ, ответственность за итоговый текст и его сдачу лежит на вас.",ja:"AIの事実の誤り、不適切な表現、偏りは学生が自分で確認しなければなりません。AIの使用を明記しても、最終的な作成と提出の責任は学生にあります。",mn:"Хиймэл оюуны баримтын алдаа, зохисгүй хэллэг, өрөөсгөл хандлагыг оюутан өөрөө шалгах ёстой. Хиймэл оюун ашигласнаа тэмдэглэсэн ч эцсийн бичвэр болон түүнийг өгөх хариуцлага оюутанд байна."}}
];

const KEY="w10-ethics-quiz";
let S={lang:null,i:0,a:Array(Q.length).fill(null),done:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.a)&&s.a.length===Q.length)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const L=()=>LANGS.find(x=>x.c===S.lang);
function tr(o,rep){
  const f=s=>rep?s.replace("{n}",rep):s;
  let h='<span class="ko">'+f(o.ko)+'</span>';
  const l=L();
  if(l&&o[l.c])h+='<span class="tr" lang="'+l.h+'">'+f(o[l.c])+'</span>';
  return h;
}
const isOk=k=>S.a[k]!==null&&S.a[k]===Q[k].ans;
const firstOpen=()=>{const k=S.a.indexOf(null);return k<0?Q.length:k};
function ansLabel(q){
  if(q.type==="ox")return q.ans===0?{ko:"O · "+T.o.ko,zh:"O · "+T.o.zh,en:"O · "+T.o.en,ru:"O · "+T.o.ru,ja:"O · "+T.o.ja,mn:"O · "+T.o.mn}:{ko:"X · "+T.x.ko,zh:"X · "+T.x.zh,en:"X · "+T.x.en,ru:"X · "+T.x.ru,ja:"X · "+T.x.ja,mn:"X · "+T.x.mn};
  const o=q.opts[q.ans],r={};for(const k in o)r[k]=(q.ans+1)+". "+o[k];return r;
}
function inline(o){const l=L();return o.ko+(l&&o[l.c]?' <span lang="'+l.h+'" style="color:var(--sub);font-weight:500">('+o[l.c]+')</span>':'')}

function renderLangs(){
  const el=document.getElementById("langs");
  el.innerHTML='<button class="lang" id="lang-none" data-lang="" aria-pressed="'+(!S.lang)+'">한국어만</button>'+
    LANGS.map(l=>'<button class="lang" id="lang-'+l.c+'" lang="'+l.h+'" data-lang="'+l.c+'" aria-pressed="'+(S.lang===l.c)+'">'+l.l+'</button>').join("");
  const h=document.getElementById("heroTr"),l=L();
  h.textContent=l?T.hero[l.c]:"";h.lang=l?l.h:"";h.hidden=!l;
}
function renderProg(){
  const fo=firstOpen();
  document.getElementById("prog").innerHTML=Q.map((q,k)=>{
    const cls=["seg"];if(S.a[k]!==null)cls.push(isOk(k)?"ok":"no");if(!S.done&&k===S.i)cls.push("cur");
    return '<button class="'+cls.join(" ")+'" data-go="'+k+'"'+(k>fo?" disabled":"")+' aria-label="'+(k+1)+'번 문제">'+(k+1)+'</button>';
  }).join("");
}
function qView(){
  const k=S.i,q=Q[k],a=S.a[k],done=a!==null,ok=done&&a===q.ans;
  let h='<article class="card"><div class="qhead"><span class="qnum">Q'+(k+1)+'</span><span class="chip soft">'+(q.type==="ox"?T.ox.ko:T.mc.ko)+'</span><span class="count">'+(k+1)+' / '+Q.length+'</span></div>';
  h+='<h2 class="qtext">'+tr(q.q)+'</h2>';
  const st=v=>!done?"":(v===q.ans?" is-right":(v===a?" is-wrong":" is-dim"));
  if(q.type==="ox"){
    h+='<div class="oxrow">'+[0,1].map(v=>'<button class="ox'+(v?" x":"")+st(v)+'" id="q'+k+'-'+v+'" data-pick="'+v+'"'+(done?" disabled":"")+'><span class="gl">'+(v?"X":"O")+'</span><span class="lab">'+tr(v?T.x:T.o)+'</span></button>').join("")+'</div>';
  }else{
    h+='<div class="opts">'+q.opts.map((o,v)=>'<button class="opt'+st(v)+'" id="q'+k+'-'+v+'" data-pick="'+v+'"'+(done?" disabled":"")+'><span class="bd">'+(v+1)+'</span><span class="tx">'+tr(o)+'</span></button>').join("")+'</div>';
  }
  if(done){
    h+='<div class="fb '+(ok?"ok":"no")+'" role="status"><p class="verdict"><span class="mk" aria-hidden="true">'+(ok?"✓":"✕")+'</span><span>'+tr(ok?T.right:T.wrong)+'</span></p>';
    if(!ok)h+='<p class="ans"><b>'+T.answer.ko+'</b> '+inline(ansLabel(q))+'</p>';
    h+='<div class="exp"><div class="exp-h"><span class="chip cream">'+T.exp.ko+(L()?' · <span lang="'+L().h+'">'+T.exp[L().c]+'</span>':'')+'</span><span class="src">'+q.src+'</span></div><p>'+tr(q.exp)+'</p></div></div>';
  }
  h+='<div class="nav">';
  if(k>0)h+='<button class="btn ghost" id="btn-prev" data-act="prev">'+T.prev.ko+'</button>';
  if(done){
    const last=k===Q.length-1||firstOpen()===Q.length&&k===Q.length-1;
    const allDone=firstOpen()===Q.length;
    if(k<Q.length-1)h+='<button class="btn primary" id="btn-next" data-act="next">'+tr(T.next)+'</button>';
    else if(allDone)h+='<button class="btn primary" id="btn-result" data-act="result">'+tr(T.result)+'</button>';
  }
  h+='</div>';
  if(!done)h+='<p class="hint">'+inline(T.pick)+'</p>';
  return h+'</article>';
}
function rView(){
  const n=Q.filter((q,k)=>isOk(k)).length;
  const msg=n===Q.length?T.m10:(n>=7?T.m7:T.m0);
  let h='<section class="card result"><span class="chip gold">Result</span>';
  h+='<p class="score"><b>'+n+'</b><span>/ '+Q.length+'</span></p>';
  h+='<p class="r-line">'+tr(T.got,String(n))+'</p><p class="r-msg">'+tr(msg)+'</p>';
  const wrong=Q.map((q,k)=>k).filter(k=>!isOk(k));
  if(wrong.length){
    h+='<div class="review"><h3>'+inline(T.review)+'</h3><ol class="rv">'+wrong.map(k=>'<li><span class="n">Q'+(k+1)+'</span><div class="c">'+tr(Q[k].q)+'<p class="ans"><b>'+T.answer.ko+'</b> '+inline(ansLabel(Q[k]))+'</p></div><button id="rv-'+k+'" data-go="'+k+'">'+T.see.ko+'</button></li>').join("")+'</ol></div>';
  }else{
    h+='<div class="allok">'+tr(T.allok)+'</div>';
  }
  h+='<div class="nav"><button class="btn primary" id="btn-retry" data-act="retry">'+tr(T.retry)+'</button></div></section>';
  return h;
}
function render(focusTop){
  renderLangs();renderProg();
  document.getElementById("app").innerHTML=S.done?rView():qView();
  if(focusTop){const p=document.getElementById("prog");const y=p.getBoundingClientRect().top+window.scrollY-70;if(window.scrollY>y)window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}

document.getElementById("langs").addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]");if(!b)return;
  S.lang=b.dataset.lang||null;save();render(false);
});
document.addEventListener("click",e=>{
  const pick=e.target.closest("[data-pick]");
  if(pick&&!pick.disabled){S.a[S.i]=Number(pick.dataset.pick);save();render(false);
    const fb=document.querySelector(".fb");if(fb&&fb.getBoundingClientRect().top>window.innerHeight-120)fb.scrollIntoView({block:"nearest",behavior:"smooth"});return;}
  const go=e.target.closest("[data-go]");
  if(go&&!go.disabled){S.i=Number(go.dataset.go);S.done=false;save();render(true);return;}
  const act=e.target.closest("[data-act]");if(!act)return;
  const a=act.dataset.act;
  if(a==="next"){S.i=Math.min(S.i+1,Q.length-1);}
  else if(a==="prev"){S.i=Math.max(S.i-1,0);}
  else if(a==="result"){S.done=true;}
  else if(a==="retry"){S.a=Array(Q.length).fill(null);S.i=0;S.done=false;}
  save();render(true);
});
render(false);
</script>
</body>
</html>
